<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N/G - Mein Workspace</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d0e12;
            color: #e3e6ed;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* --- SEITENLEISTE --- */
        .sidebar {
            width: 240px;
            background-color: #13151a;
            border-right: 1px solid #1f232d;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .logo-area {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff;
        }
        .logo-area span { color: #2eaadc; }

        .sidebar-section h3 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #525966;
            margin: 0 0 12px 0;
        }

        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 6px;
            color: #a0a6b3;
            font-size: 14px;
        }

        .menu-item.active {
            background-color: #1c1f26;
            color: #ffffff;
        }

        /* --- HAUPTBEREICH --- */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* --- INPUT BEREICH --- */
        .input-wrapper {
            background: linear-gradient(135deg, rgba(46, 170, 220, 0.1), rgba(161, 85, 230, 0.1));
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .input-row { display: flex; gap: 12px; }

        input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            border: 1px solid #1f232d;
            border-radius: 8px;
            background-color: #13151a;
            color: #ffffff;
            font-size: 15px;
        }
        input:focus { outline: none; border-color: #2eaadc; }

        select {
            padding: 14px;
            border: 1px solid #1f232d;
            border-radius: 8px;
            background-color: #13151a;
            color: #ffffff;
            font-size: 15px;
            cursor: pointer;
        }

        button.primary-btn {
            padding: 14px 24px;
            background: linear-gradient(135deg, #2eaadc, #a155e6);
            color: white;
            font-size: 15px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        /* --- KANBAN BOARD LAYOUT --- */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .column {
            background-color: #13151a;
            border: 1px solid #1f232d;
            border-radius: 12px;
            padding: 20px;
            min-height: 400px;
            display: flex;
            flex-direction: column;
        }

        .column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #1f232d;
        }

        .column-header h2 { font-size: 14px; margin: 0; color: #ffffff; text-transform: uppercase; }
        .counter { background-color: #1f232d; color: #a0a6b3; padding: 2px 8px; border-radius: 20px; font-size: 11px; }
        .task-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; flex-grow: 1; }

        /* --- KARTEN DESIGN --- */
        .task-card {
            background-color: #1c1f26;
            border: 1px solid #242936;
            border-radius: 10px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #todo-list .task-card { border-left: 3px solid #2eaadc; }
        #progress-list .task-card { border-left: 3px solid #a155e6; }
        #done-list .task-card { border-left: 3px solid #22c55e; }

        .task-text { font-size: 15px; color: #e3e6ed; word-break: break-word; }
        .tag { display: inline-block; align-self: flex-start; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
        .tag.wichtig { background-color: rgba(239, 68, 68, 0.15); color: #ef4444; }
        .tag.notiz { background-color: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        .tag.goodnotes { background-color: rgba(168, 85, 247, 0.15); color: #a855f7; }
        
        .task-footer { display: flex; justify-content: space-between; align-items: center; }
        .task-actions { display: flex; gap: 6px; }

        .action-btn { background-color: #13151a; border: none; color: #a0a6b3; padding: 6px 10px; font-size: 12px; border-radius: 6px; cursor: pointer; }
        .action-btn:hover { background-color: #242936; color: #ffffff; }
        .action-btn.delete { color: #ef4444; }
        .action-btn.delete:hover { background-color: rgba(239, 68, 68, 0.15); }

        .status-bar { margin-top: auto; font-size: 12px; color: #525966; display: flex; justify-content: space-between; border-top: 1px solid #1f232d; padding-top: 15px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo-area">N<span>/</span>G</div>
        <div class="sidebar-section">
            <h3>Übersicht</h3>
            <ul class="sidebar-menu">
                <li class="menu-item active">💻 Workspace</li>
            </ul>
        </div>
    </div>

    <div class="main-content">
        
        <div class="header-bar">
            <h1>Mein Workspace</h1>
        </div>
        
        <div class="input-wrapper">
            <div class="input-row">
                <input type="text" id="taskInput" placeholder="Neue Aufgabe, Notiz oder Link hinzufügen..." autocomplete="off">
                <select id="tagSelect">
                    <option value="notiz">🔵 Notiz</option>
                    <option value="wichtig">🔴 Wichtig</option>
                    <option value="goodnotes">🟣 GoodNotes</option>
                </select>
                <button id="addBtn" class="primary-btn">+ Hinzufügen</button>
            </div>
        </div>

        <div class="board">
            <div class="column">
                <div class="column-header">
                    <h2>Zu tun</h2>
                    <span id="todo-count" class="counter">0</span>
                </div>
                <ul id="todo-list" class="task-list"></ul>
            </div>

            <div class="column">
                <div class="column-header">
                    <h2>In Arbeit</h2>
                    <span id="progress-count" class="counter">0</span>
                </div>
                <ul id="progress-list" class="task-list"></ul>
            </div>

            <div class="column">
                <div class="column-header">
                    <h2>Erledigt</h2>
                    <span id="done-count" class="counter">0</span>
                </div>
                <ul id="done-list" class="task-list"></ul>
            </div>
        </div>

        <div class="status-bar">
            <span>Hosted via GitHub Pages</span>
            <span>🔒 Daten lokal und sicher im Browser gespeichert</span>
        </div>
    </div>

    <script>
        // Lädt die Daten beim Starten aus dem LocalStorage
        let tasks = JSON.parse(localStorage.getItem('workspace_tasks_v7')) || [];

        const taskInput = document.getElementById('taskInput');
        const tagSelect = document.getElementById('tagSelect');
        const addBtn = document.getElementById('addBtn');

        function saveToLocalStorage() {
            localStorage.setItem('workspace_tasks_v7', JSON.stringify(tasks));
        }

        function createNewTask() {
            const text = taskInput.value.trim();
            if (text === "") return;

            const newTask = {
                id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                text: text,
                tag: tagSelect.value,
                status: 'todo'
            };

            tasks.push(newTask);
            saveToLocalStorage();
            renderBoard();

            taskInput.value = "";
            taskInput.focus();
        }

        function moveTask(id, newStatus) {
            tasks = tasks.map(task => {
                if (task.id === id) task.status = newStatus;
                return task;
            });
            saveToLocalStorage();
            renderBoard();
        }

        function deleteTask(id) {
            tasks = tasks.filter(task => task.id !== id);
            saveToLocalStorage();
            renderBoard();
        }

        function renderBoard() {
            document.getElementById('todo-list').innerHTML = '';
            document.getElementById('progress-list').innerHTML = '';
            document.getElementById('done-list').innerHTML = '';

            let counts = { todo: 0, progress: 0, done: 0 };

            tasks.forEach(task => {
                counts[task.status]++;

                const li = document.createElement('li');
                li.className = 'task-card';

                const tagSpan = document.createElement('span');
                tagSpan.className = `tag ${task.tag}`;
                tagSpan.textContent = task.tag;
                li.appendChild(tagSpan);

                const textSpan = document.createElement('span');
                textSpan.className = 'task-text';
                textSpan.textContent = task.text;
                li.appendChild(textSpan);

                const footer = document.createElement('div');
                footer.className = 'task-footer';

                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'task-actions';

                // Zurück-Button (wenn nicht in 'todo')
                if (task.status === 'progress' || task.status === 'done') {
                    const backBtn = document.createElement('button');
                    backBtn.className = 'action-btn';
                    backBtn.textContent = '◀';
                    backBtn.onclick = () => moveTask(task.id, task.status === 'done' ? 'progress' : 'todo');
                    actionsDiv.appendChild(backBtn);
                }

                // Löschen-Button
                const delBtn = document.createElement('button');
                delBtn.className = 'action-btn delete';
                delBtn.textContent = '🗑';
                delBtn.onclick = () => deleteTask(task.id);

                // Vorwärts-Button (wenn nicht in 'done')
                if (task.status === 'todo' || task.status === 'progress') {
                    const nextBtn = document.createElement('button');
                    nextBtn.className = 'action-btn';
                    nextBtn.textContent = task.status === 'todo' ? '▶' : '✔';
                    nextBtn.onclick = () => moveTask(task.id, task.status === 'todo' ? 'progress' : 'done');
                    actionsDiv.appendChild(nextBtn);
                }

                actionsDiv.insertBefore(delBtn, actionsDiv.children[1] || null);
                footer.appendChild(actionsDiv);
                li.appendChild(footer);

                document.getElementById(`${task.status}-list`).appendChild(li);
            });

            document.getElementById('todo-count').textContent = counts.todo;
            document.getElementById('progress-count').textContent = counts.progress;
            document.getElementById('done-count').textContent = counts.done;
        }

        addBtn.addEventListener('click', createNewTask);
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') createNewTask();
        });

        // Board beim ersten Laden aufbauen
        renderBoard();
    </script>
</body>
</html>
